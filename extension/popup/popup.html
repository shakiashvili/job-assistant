<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AI Job Assistant</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <header class="header">
      <div class="logo-area">
        <div class="logo-icon">🤖</div>
        <div>
          <h1>AI Job Assistant</h1>
          <span class="subtext">Human-in-the-Loop Co-pilot</span>
        </div>
      </div>
      <div class="connection-badge" id="backend-status">
        <span class="dot"></span>
        <span id="backend-text">Connecting...</span>
      </div>
    </header>

    <div class="candidate-card">
      <div class="candidate-avatar">CA</div>
      <div class="candidate-info">
        <div class="name" id="cand-name">Candidate Profile</div>
        <div class="title" id="cand-title">Upload skills.md to configure</div>
        <div class="meta">Remote &amp; Georgia • Active Session</div>
      </div>
    </div>

    <div class="section-box" id="tab-status-box">
      <div class="box-label">Active Tab Context</div>
      <div class="tab-info">
        <span class="portal-pill" id="portal-pill">Detecting...</span>
        <span class="tab-title-text" id="tab-title">Reading current page...</span>
      </div>
    </div>

    <!-- Match score preview -->
    <div class="section-box" id="match-box">
      <div class="box-header">
        <span class="box-label">Gemini 2.5 Job Match</span>
        <span class="score-percent" id="score-val">--%</span>
      </div>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="score-bar" style="width: 0%;"></div>
      </div>
      <div class="breakdown-pills" id="breakdown-pills">
        <span class="pill">Skills: --</span>
        <span class="pill">Visa: --</span>
        <span class="pill">Exp: --</span>
      </div>
      <div id="blockers-preview" class="blockers-list"></div>
    </div>

    <!-- Variant selector -->
    <div class="section-box">
      <label class="box-label" for="popup-variant">Active CV Variant</label>
      <select id="popup-variant" class="variant-select">
        <option value="qa_automation">QA Automation (Playwright / Python / CI)</option>
        <option value="qa_manual">QA Manual (Exploratory / Quality Governance)</option>
        <option value="tech_support">Tech Support (Tier 3 / API & SQL Debug)</option>
      </select>
    </div>

    <!-- Configurable Backend API Base URL (chrome.storage.sync) -->
    <div class="section-box">
      <label class="box-label" for="api-base-url-input">Backend API URL</label>
      <div style="display:flex; gap:6px; margin-top:4px;">
        <input id="api-base-url-input" type="text" value="http://localhost:8000" style="flex:1; background:#0f172a; border:1px solid #334155; color:#e2e8f0; border-radius:6px; padding:5px 8px; font-size:11px;" />
        <button id="btn-save-api-url" class="btn btn-secondary" style="padding:5px 10px; font-size:11px;">Save</button>
      </div>
    </div>

    <!-- Action Buttons -->
    <div class="actions">
      <button class="btn btn-primary" id="btn-popup-autofill">
        <span>⚡</span> Autofill & Stage Form
      </button>
      <button class="btn btn-secondary" id="btn-popup-audit">
        <span>🔍</span> Audit Page with Gemini
      </button>
      <button class="btn btn-accent" id="btn-open-dashboard">
        <span>🌐</span> Open Web Dashboard
      </button>
    </div>

    <footer class="footer">
      <span>FastAPI :8000 • Gemini 2.5 Flash</span>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
