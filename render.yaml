services:
  - type: web
    name: talentflow-ai-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    # Production requires a non-ephemeral plan (Starter+ with persistent disk and/or S3/R2 object storage).
    # Do NOT launch public multi-user accounts on Render Free (ephemeral disk, 15-min idle spin-down, SMTP blocked).
    plan: starter
    region: frankfurt
    healthCheckPath: /api/health
    disk:
      name: talentflow-data
      mountPath: /app/data
      sizeGB: 5
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: ENABLE_PLAYWRIGHT
        value: "false"
      - key: SCRAPE_WORKER_MODE
        value: embedded
      - key: OTP_EMAIL_ENABLED
        value: "true"
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "14"
      - key: SECRET_KEY
        generateValue: true
      - key: ENCRYPTION_KEY
        sync: false
      - key: BLIND_INDEX_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: GEMINI_FAST_MODEL
        value: gemini-3.5-flash-lite
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      # Recommended production object storage (Cloudflare R2 / AWS S3) for horizontal scaling:
      # Configure S3_BUCKET, S3_ENDPOINT_URL, S3_ACCESS_KEY_ID, S3_SECRET_ACCESS_KEY, S3_REGION in dashboard.
      # Recommended production HTTPS OTP email provider (port 443, avoids blocked SMTP ports):
      # Configure RESEND_API_KEY (or SENDGRID_API_KEY) and EMAIL_FROM in dashboard, or set OTP_EMAIL_ENABLED=false.

# Optional dedicated background scrape worker (recommended when scaling beyond 1 API instance):
