name: TalentFlow CI (Backend, Security, Frontend & Extension)

on:
  push:
    branches: [ main, "feat/**", "agent/**" ]
  pull_request:
    branches: [ main ]

jobs:
  backend-and-security-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: talentflow
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: talentflow_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U talentflow -d talentflow_ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt
      - name: Install system fonts and backend dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-freefont-ttf fonts-dejavu-core
          pip install -r backend/requirements.txt ruff
          python -m playwright install chromium --with-deps
      - name: Run Python lint check (ruff)
        working-directory: backend
        run: ruff check app tests --select E9,F63,F7,F82
      - name: Verify Alembic migrations from scratch (SQLite and PostgreSQL)
        working-directory: backend
        env:
          PYTHONPATH: .
        run: |
          DATABASE_URL=sqlite:///./ci_migration_smoke.db alembic upgrade head
          rm -f ci_migration_smoke.db
          DATABASE_URL=postgresql+psycopg2://talentflow:ci_test_password@localhost:5432/talentflow_ci alembic upgrade head
      - name: Run backend functional & unit tests
        working-directory: backend
        env:
          PYTHONPATH: .
        run: python -m pytest tests -q --tb=short
      - name: Run security & exploit-resistance tests
        env:
          PYTHONPATH: backend
        run: python -m pytest tests/non_functional/test_security.py -v --tb=short

  frontend-and-extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install, typecheck, test, and build frontend
        working-directory: frontend
        run: |
          npm ci
          npx tsc --noEmit
          npm test
          npm run build
      - name: Validate Chrome Extension JS & Manifest
        run: |
          node --check extension/background/service_worker.js
          node --check extension/content/content.js
          node --check extension/popup/popup.js
          node -e "JSON.parse(require('fs').readFileSync('extension/manifest.json','utf8')); console.log('manifest valid')"
