name: TalentFlow CI (Backend, Security, Frontend & Extension)

on:
  push:
    branches: [ main, "feat/**" ]
  pull_request:
    branches: [ main ]

jobs:
  backend-and-security-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
      - name: Run backend functional & unit tests
        working-directory: backend
        run: pytest tests -q --tb=short
      - name: Run security & exploit-resistance tests
        run: pytest tests/non_functional/test_security.py -v --tb=short

  frontend-and-extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install and build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Validate Chrome Extension JS & Manifest
        run: |
          node --check extension/background/service_worker.js
          node --check extension/content/content.js
          node --check extension/popup/popup.js
          node -e "JSON.parse(require('fs').readFileSync('extension/manifest.json','utf8')); console.log('manifest valid')"
